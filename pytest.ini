[pytest]
pythonpath = src
testpaths = tests/unit tests/integration tests/e2e
addopts = -m "not e2e"
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    unit: fast hermetic unit tests
    integration: hermetic in-process multi-component integration tests
    e2e: end-to-end multi-process cluster tests
    asyncio: mark test to run in an asyncio event loop


